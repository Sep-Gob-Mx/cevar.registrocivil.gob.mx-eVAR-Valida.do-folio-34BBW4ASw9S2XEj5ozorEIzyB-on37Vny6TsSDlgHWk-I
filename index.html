<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Documento</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}


/* =========================
   PC
========================= */

.visor {
    width: 100vw;
    height: 100vh;

    overflow: auto;
}

.imagen-pantalla {
    display: block;

    width: 100vw;
    height: 100vh;

    object-fit: contain;
    object-position: top center;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .visor {
        width: 100vw;
        height: 100dvh;

        overflow-x: auto;
        overflow-y: auto;

        -webkit-overflow-scrolling: touch;
    }

    .imagen-pantalla {
        /*
          300% = imagen 3 veces
          más ancha que el celular
        */

        width: 300vw;

        height: auto;
        max-width: none;

        display: block;

        margin: 0;
        padding: 0;
    }
}

</style>
</head>

<body>


<div class="visor" id="visor">

    <img
        src="images/Sin título.jpg"
        class="imagen-pantalla"
        id="documento"
        alt="Documento"
    >

</div>


<script>

const visor = document.getElementById("visor");
const imagen = document.getElementById("documento");


function abrirEnCentro() {

    if (window.innerWidth <= 600) {

        /*
        Calculamos el centro EXACTO
        de la imagen
        */

        const anchoImagen = imagen.offsetWidth;
        const anchoPantalla = visor.clientWidth;

        const posicionCentro =
            (anchoImagen / 2) -
            (anchoPantalla / 2);


        /*
        CENTRO HORIZONTAL
        */

        visor.scrollLeft = posicionCentro;


        /*
        ARRIBA DE TODO
        */

        visor.scrollTop = 0;

    }

}


/*
Esperar a que cargue
completamente la imagen
*/

imagen.onload = function () {

    abrirEnCentro();

    setTimeout(abrirEnCentro, 100);
    setTimeout(abrirEnCentro, 500);
    setTimeout(abrirEnCentro, 1000);

};


/*
Por si la imagen ya estaba
guardada en caché
*/

window.onload = function () {

    abrirEnCentro();

    setTimeout(abrirEnCentro, 100);
    setTimeout(abrirEnCentro, 500);
    setTimeout(abrirEnCentro, 1000);

};


/*
Importante para Brave/Chrome
en celular
*/

window.addEventListener("pageshow", function () {

    setTimeout(abrirEnCentro, 200);
    setTimeout(abrirEnCentro, 700);

});

</script>

</body>
</html>
